# Every gate cr has, on every push to main, every tag `v*` and every pull
# request, and the image last.
#
# `go` is what a desk runs: gofmt, build, vet, tests, and `pd gen --check`,
# which is the only thing that notices a generated file that was not
# regenerated -- it compiles perfectly and is wrong.
#
# `conformance` is the OCI distribution-spec suite against the built binary,
# through `scripts/conformance.sh`, so what CI runs and what a desk runs are
# the same command.
#
# `image` needs every other job, so what reaches the registry is what the gates
# passed.
name: ci

# `workflow_dispatch` because the image job is here: a rebuild of what `main`
# already is should not need an empty commit.
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          v="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$v" ]; then
            echo "not gofmt'd:"; echo "$v"; exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
      - run: go test -count=1 ./...
      - run: go tool pd gen --check .

  # The index on the database a replicated deployment runs on. SQLite is what
  # the `go` job uses and should keep using; it is also permissive in the
  # directions that hide mistakes, and the per-repository lock is a different
  # mechanism there.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: cr
          POSTGRES_PASSWORD: cr
          POSTGRES_DB: cr
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -count=1 -run 'TestPostgres' ./index/...
        env:
          CR_TEST_POSTGRES: postgres://cr:cr@127.0.0.1:5432/cr?sslmode=disable

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: ./scripts/conformance.sh
        env:
          RESULTS_DIR: ${{ github.workspace }}/results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: conformance
          path: results/

  # The page and the server inside it: the sandbox module builds, and the
  # page type-checks and bundles.
  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
        working-directory: ts
      - run: |
          mkdir -p ts/public
          cp "$(go env GOROOT)/lib/wasm/wasm_exec.js" ts/public/
          GOOS=js GOARCH=wasm go build -tags grpcnotrace -o ts/public/app.wasm ./wasm
      - run: npm run build
        working-directory: ts

  # The image, for linux/amd64 and linux/arm64. A pull request builds it and
  # pushes nothing; main pushes `ghcr.io/lesomnus/cr` under the four tags
  # `docker-bake.hcl` names, `:edge` among them; a tag `v*` pushes them with
  # the tag in place of `:edge`, and stamps the binary with it.
  image:
    needs: [go, postgres, conformance, sandbox]
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write # to push to ghcr.io/lesomnus/cr

    env:
      TAG: edge
      BUILD_HASH: ${{ github.sha }}
      BUILD_ID: r${{ github.run_id }}
      # A push to main or to a tag `v*`, or a run started by hand on main:
      # never a pull request, and never another branch.
      PUBLISH: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}

    steps:
      - uses: actions/checkout@v5

      # A release: the image's tag is the git tag, and so is what `cr version`
      # answers.
      - if: startsWith(github.ref, 'refs/tags/v')
        run: |
          echo "TAG=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"
          echo "APP_VERSION=${GITHUB_REF_NAME}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      # No QEMU. The stage that builds runs on the runner's architecture and
      # cross-compiles, so `linux/arm64` is a second link rather than a second
      # run under emulation -- see `Dockerfile`. Setting it up anyway would be
      # minutes a build, spent on nothing.

      - uses: docker/login-action@v4
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        id: build
        uses: docker/bake-action@v7
        with:
          files: docker-bake.hcl
          targets: app
          push: ${{ env.PUBLISH == 'true' }}
          set: |
            app.cache-from=type=gha,scope=app
            app.cache-to=type=gha,scope=app,mode=max

      # What was pushed, said once, rather than left for somebody to ask the
      # registry what a moving tag points at now. `:edge` moves; the digest is
      # what a deployment that means to stay put is told.
      - name: Summarise
        if: env.PUBLISH == 'true'
        env:
          METADATA: ${{ steps.build.outputs.metadata }}
        run: |
          set -eu
          {
            echo "| image | digest |"
            echo "| ----- | ------ |"
            printf '%s' "$METADATA" | jq -r '
              to_entries[]
              | select(.value["image.name"])
              | "| \(.value["image.name"] | split(",")[0]) | `\(.value["containerimage.digest"])` |"
            '
          } >> "$GITHUB_STEP_SUMMARY"
